<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="feltGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </radialGradient>
    <radialGradient id="ball8Grad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="60%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <radialGradient id="shineGrad" cx="30%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Canvas -->
  <rect width="512" height="512" rx="112" fill="#0f172a"/>
  
  <!-- Billiard Table Cushion / Felt Inner -->
  <rect x="36" y="36" width="440" height="440" rx="88" fill="url(#feltGrad)" stroke="#1e293b" stroke-width="10"/>
  
  <!-- Subtle diamond markers on rails -->
  <circle cx="256" cy="20" r="4" fill="#fbbf24"/>
  <circle cx="256" cy="492" r="4" fill="#fbbf24"/>
  <circle cx="20" cy="256" r="4" fill="#fbbf24"/>
  <circle cx="492" cy="256" r="4" fill="#fbbf24"/>
  
  <!-- 8 Ball with drop shadow -->
  <circle cx="256" cy="256" r="140" fill="url(#ball8Grad)" filter="url(#shadow)"/>
  
  <!-- Ball Highlight / Specular Reflection -->
  <ellipse cx="220" cy="200" rx="70" ry="45" fill="url(#shineGrad)" transform="rotate(-25 220 200)"/>
  
  <!-- Center White Circle -->
  <circle cx="256" cy="256" r="62" fill="#f8fafc"/>
  
  <!-- Number 8 -->
  <text x="256" y="278" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="76" fill="#0f172a" text-anchor="middle">8</text>
</svg>
